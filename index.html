<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>
    <!-- Ensure the href path perfectly matches your folder structure -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <button id="theme-toggle" class="theme-btn">🌓 Toggle Theme</button>
    
    <div class="dashboard">
        <!-- Greeting Section -->
        <header class="card text-center top-header">
            <h1 id="time-display">00:00:00</h1>
            <p id="date-display">Day, Month DD, YYYY</p>
            <h2>Good <span id="greeting-time">Morning</span>, <span id="user-name" contenteditable="true" title="Click to edit your name">Raida</span></h2>
        </header>

        <div class="grid-container">
            <div class="left-col">
                <!-- Focus Timer -->
                <section class="card text-center">
                    <h3>Focus Timer</h3>
                    <h1 id="timer-display">25:00</h1>
                    
                    <!-- Added Pomodoro Time Editor -->
                    <div class="timer-settings">
                        <input type="number" id="time-input" value="25" min="1" max="120" title="Set minutes">
                        <button id="btn-set-time" class="btn-secondary btn-small">Set Min</button>
                    </div>

                    <div class="btn-group">
                        <button id="btn-start" class="btn-primary">Start</button>
                        <button id="btn-stop" class="btn-secondary">Stop</button>
                        <button id="btn-reset" class="btn-secondary">Reset</button>
                    </div>
                </section>

                <!-- Quick Links -->
                <section class="card">
                    <h3>Quick Links</h3>
                    <div class="input-group">
                        <input type="text" id="link-name" placeholder="Link name">
                        <input type="url" id="link-url" placeholder="URL">
                        <button id="btn-add-link" class="btn-primary">Add Link</button>
                    </div>
                    <div id="links-container" class="links-grid"></div>
                </section>
            </div>

            <div class="right-col">
                <!-- To-Do List -->
                <section class="card">
                    <h3>Tasks</h3>
                    <div class="input-group">
                        <input type="text" id="task-input" placeholder="Add a new task...">
                        <button id="btn-add-task" class="btn-primary">Add</button>
                    </div>
                    <ul id="task-list"></ul>
                </section>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
